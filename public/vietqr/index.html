<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tool Hub" />

    <link rel="shortcut icon" href="/vietqr/assets/index.svg" type="image/x-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="min-h-screen bg-slate-100 p-4 font-sans text-slate-900">

    <main class="mx-auto w-full max-w-2xl">

        <!-- Welcome -->
        <section class="mb-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">

            <div class="mb-6">
                <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-blue-600">
                    <i class="fa-solid fa-house text-xl"></i>
                </div>

                <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                    Welcome to the Home Page
                </h1>

                <p class="mt-2 text-slate-500">
                    This is the main landing page of the website.
                </p>
            </div>

            <button
                id="btn-goto-vietqr"
                type="button"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 active:scale-[0.98]">

                <i class="fa-solid fa-qrcode"></i>

                Go to VietQR Tool

            </button>

        </section>

    </main>

    <script>
        document.getElementById('btn-goto-vietqr')?.addEventListener('click', () => {
            window.location.href = 'vietqr.html';
        });
    </script>

    <script src="/assets/pwa.js" defer></script>
    <script src="/assets/workspace-launcher.js" defer></script>
</body>

</html>
