<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VietQR Tool</title>

    <link rel="shortcut icon" href="./assets/index.svg" type="image/x-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 p-4 font-sans">

    <main class="mx-auto w-full max-w-2xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-xl">

        <!-- Header -->
        <header class="flex items-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-5 text-white">
            <a href="/" title="Về Tool Hub"
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-blue-100 transition hover:bg-white/15 hover:text-white">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/20 text-xl backdrop-blur">
                <i class="fa-solid fa-qrcode"></i>
            </div>

            <div>
                <p class="text-[10px] font-semibold uppercase tracking-wider text-blue-200">Tool Hub</p>
                <h1 class="text-xl font-bold">
                    VietQR Generator
                </h1>
                <p class="mt-0.5 text-sm text-blue-100">
                    Tạo mã QR thanh toán nhanh chóng
                </p>
            </div>
        </header>

        <!-- Body -->
        <section class="p-5 sm:p-6">

            <!-- Bank -->
            <div class="mb-5">
                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Ngân hàng
                </label>

                <select
                    id="select-bank"
                    class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-base text-gray-700 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                    <option value="" disabled selected>
                        Đang tải danh sách ngân hàng...
                    </option>
                </select>
            </div>

            <!-- Account + Name -->
            <div class="mb-5 grid grid-cols-1 gap-4 md:grid-cols-2">

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        Số tài khoản
                    </label>

                    <input
                        type="number"
                        id="input-account"
                        placeholder="0123456789"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">
                        Tên thụ hưởng
                    </label>

                    <input
                        type="text"
                        id="input-name"
                        placeholder="NGUYEN DUC LONG"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 text-base uppercase text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>

            </div>

            <!-- Amount -->
            <div class="mb-5">

                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Số tiền
                </label>

                <div class="relative">

                    <input
                        type="number"
                        id="input-amount"
                        placeholder="0"
                        class="w-full rounded-xl border border-gray-300 py-3 pl-4 pr-16 text-base text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-semibold text-gray-400">
                        VND
                    </span>

                </div>

            </div>

            <!-- Description -->
            <div class="mb-6">

                <label class="mb-2 block text-sm font-semibold text-gray-700">
                    Nội dung chuyển khoản
                </label>

                <textarea
                    id="input-desc"
                    rows="3"
                    placeholder="Ví dụ: Chuyển tiền ăn trưa"
                    class="w-full resize-none rounded-xl border border-gray-300 px-4 py-3 text-base text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></textarea>

            </div>

            <!-- Generate Button -->
            <button
                type="button"
                id="btn-generate"
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-5 py-3.5 text-base font-bold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 hover:shadow-xl active:scale-[0.98]">

                <i class="fa-solid fa-qrcode"></i>
                TẠO MÃ QR THANH TOÁN

            </button>

            <!-- QR Display -->
            <div class="mt-6 overflow-hidden rounded-2xl border border-dashed border-gray-300 bg-gray-50 p-5">

                <!-- Status -->
                <div
                    id="qr-status"
                    class="flex min-h-[280px] flex-col items-center justify-center text-center">

                    <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 text-blue-300">
                        <i class="fa-solid fa-qrcode text-3xl"></i>
                    </div>

                    <p class="font-medium text-gray-500">
                        Vui lòng nhập thông tin
                    </p>

                    <p class="mt-1 text-sm text-gray-400">
                        Mã QR sẽ xuất hiện tại đây
                    </p>

                </div>

                <!-- QR Image -->
                <div class="hidden text-center" id="qr-wrapper">

                    <img
                        src=""
                        alt="Mã QR thanh toán"
                        id="qr-image"
                        crossorigin="anonymous"
                        class="mx-auto max-h-[400px] w-full max-w-[400px] rounded-xl bg-white p-3 shadow-sm">

                </div>

                <!-- Actions -->
                <div
                    id="qr-actions"
                    class="mt-5 hidden grid grid-cols-1 gap-3 sm:grid-cols-2">

                    <button
                        id="btn-copy"
                        type="button"
                        class="flex items-center justify-center gap-2 rounded-xl border border-blue-200 bg-white px-4 py-3 font-semibold text-blue-600 transition hover:bg-blue-50 active:scale-[0.98]">

                        <i class="fa-solid fa-copy"></i>
                        Copy Ảnh

                    </button>

                    <a
                        id="btn-download"
                        href="#"
                        download="VietQR.png"
                        class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white px-4 py-3 font-semibold text-gray-700 transition hover:bg-gray-100 active:scale-[0.98]">

                        <i class="fa-solid fa-download"></i>
                        Tải về

                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Toast -->
    <div
        id="liveToast"
        class="pointer-events-none fixed right-4 top-4 z-50 w-[calc(100%-2rem)] max-w-sm translate-y-[-20px] opacity-0 transition duration-300">

        <div class="pointer-events-auto flex items-center rounded-xl bg-gray-900 px-4 py-3 text-white shadow-2xl">

            <div class="toast-body flex-1 text-center text-sm font-semibold"></div>

            <button
                type="button"
                class="ml-3 text-gray-300 transition hover:text-white"
                data-bs-dismiss="toast">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    </div>


    <script defer src="./scripts/index.js"></script>
    <script src="/assets/workspace-launcher.js" defer></script>

</body>

</html>
